name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check PR title
        uses: actions/github-script@v6
        with:
          script: |
            const title = context.payload.pull_request.title;
            const validPrefixes = ['feat', 'fix', 'docs', 'style', 'refactor', 'perf', 'test', 'chore'];
            const hasValidPrefix = validPrefixes.some(prefix => title.startsWith(prefix + ':'));
            
            if (!hasValidPrefix) {
              core.setFailed(`PR title must start with one of: ${validPrefixes.join(', ')}`);
            }
      
      - name: Check PR description
        uses: actions/github-script@v6
        with:
          script: |
            const body = context.payload.pull_request.body;
            if (!body || body.trim().length === 0) {
              core.setFailed('PR description cannot be empty');
            }
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Check for conflicts
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "✅ No conflicts with main branch"
          else
            echo "⚠️ PR may have conflicts"
          fi
      
      - name: Check file changes
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get changed files
            const output = execSync('git diff --name-only origin/main...HEAD').toString();
            const files = output.split('\n').filter(f => f);
            
            console.log('Changed files:');
            files.forEach(f => console.log(`  - ${f}`));
            
            // Check for large files
            const largeFiles = files.filter(f => {
              try {
                const stats = fs.statSync(f);
                return stats.size > 5 * 1024 * 1024; // 5MB
              } catch {
                return false;
              }
            });
            
            if (largeFiles.length > 0) {
              core.warning(`Large files detected: ${largeFiles.join(', ')}`);
            }

  code-review:
    name: Code Review Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Check for console.log
        run: |
          if grep -r "console\.log" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" client/ server/ 2>/dev/null; then
            echo "⚠️ Warning: console.log found in code (should use logger)"
          fi
      
      - name: Check for TODO comments
        run: |
          if grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" client/ server/ 2>/dev/null; then
            echo "ℹ️ TODO/FIXME comments found"
          fi
      
      - name: Check for hardcoded secrets
        run: |
          if grep -r "password\|secret\|token\|key" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" client/ server/ 2>/dev/null | grep -v "process.env" | grep -v "SECRET" | grep -v "KEY"; then
            echo "⚠️ Warning: Possible hardcoded secrets found"
          fi

  test-coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests with coverage
        run: pnpm test -- --coverage
      
      - name: Check coverage threshold
        run: |
          # Check if coverage meets minimum threshold (80%)
          COVERAGE=$(cat coverage/coverage-summary.json | grep -o '"lines":{"total":[^}]*}' | grep -o '[0-9.]*' | head -1)
          THRESHOLD=80
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage is $COVERAGE%, below threshold of $THRESHOLD%"
            exit 1
          else
            echo "✅ Coverage is $COVERAGE%, meets threshold of $THRESHOLD%"
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run npm audit
        run: pnpm audit --audit-level=moderate || echo "⚠️ Audit warnings found"
      
      - name: Check for deprecated packages
        run: |
          pnpm outdated --depth=0 || echo "ℹ️ Some packages may be outdated"

  summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-pr, code-review, test-coverage, dependency-audit]
    if: always()
    
    steps:
      - name: Check validation results
        run: |
          echo "## PR Validation Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| PR Format | ${{ needs.validate-pr.result }} |"
          echo "| Code Review | ${{ needs.code-review.result }} |"
          echo "| Test Coverage | ${{ needs.test-coverage.result }} |"
          echo "| Dependencies | ${{ needs.dependency-audit.result }} |"
          echo ""
          
          if [ "${{ needs.validate-pr.result }}" != "success" ] || \
             [ "${{ needs.code-review.result }}" != "success" ] || \
             [ "${{ needs.test-coverage.result }}" != "success" ] || \
             [ "${{ needs.dependency-audit.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          else
            echo "✅ All checks passed"
          fi
