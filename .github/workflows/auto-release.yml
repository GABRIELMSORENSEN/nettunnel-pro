name: Auto Release on Push

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'client/src/**'
      - 'server/**'
      - 'android/**'
      - '.github/workflows/auto-release.yml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version change
        id: version
        run: |
          CURRENT_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          echo "current_version=$CURRENT_VERSION"
          echo "latest_version=$LATEST_VERSION"
          
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "version=v$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "✅ New version detected: v$CURRENT_VERSION"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "⏭️ No version change"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Copy web assets to Android
        run: |
          cp -r dist/public/* dist/ || true
          npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # NetTunnel Pro ${{ needs.check-version.outputs.version }}
            
            ## 📱 Downloads
            - **Debug APK** - Para testes e desenvolvimento
            - **Release APK** - Para produção (otimizado)
            
            ## 🚀 Como Instalar
            ```bash
            adb install app-debug.apk
            ```
            
            ## 📋 Requisitos
            - Android 7.0+ (API 24)
            - 100 MB de espaço livre
            
            ## 🎯 Features
            - Interface Cyberpunk Minimalista
            - 4 Operadoras Brasileiras (Vivo, Claro, Oi, Tim)
            - DPI Bypass com fragmentação e TLS fingerprint
            - Auto-discovery e auto-correção de servidores
            - Dashboard de Analytics
            - Logs em tempo real
            
            ---
            Gerado automaticamente pelo GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Release
        run: |
          echo "✅ Release criado com sucesso!"
          echo "Tag: ${{ needs.check-version.outputs.version }}"
          echo "APKs disponíveis para download em: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-version.outputs.version }}"
