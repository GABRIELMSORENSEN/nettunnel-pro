name: Google Play Store Deployment

on:
  workflow_run:
    workflows: ["APK Signing & Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

env:
  JAVA_VERSION: '11'
  GRADLE_VERSION: '8.0'

jobs:
  validate-playstore:
    name: Validate Play Store Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate Play Store secrets
        run: |
          if [ -z "${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "❌ PLAYSTORE_SERVICE_ACCOUNT_JSON secret not found"
            exit 1
          fi
          
          if [ -z "${{ secrets.PLAYSTORE_PACKAGE_NAME }}" ]; then
            echo "❌ PLAYSTORE_PACKAGE_NAME secret not found"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"
      
      - name: Validate app bundle
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "❌ android/app/build.gradle not found"
            exit 1
          fi
          
          echo "✅ App bundle configuration is valid"
      
      - name: Check version code
        run: |
          VERSION_CODE=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')
          echo "Current version code: $VERSION_CODE"
          
          if [ -z "$VERSION_CODE" ]; then
            echo "❌ Version code not found in build.gradle"
            exit 1
          fi
          
          echo "✅ Version code is valid: $VERSION_CODE"

  build-bundle:
    name: Build App Bundle
    runs-on: ubuntu-latest
    needs: validate-playstore
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          ndk-version: 25.1.8937393
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        run: pnpm build
      
      - name: Setup Capacitor
        run: pnpm exec cap sync android
      
      - name: Build App Bundle (AAB)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Decode keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          
          cd android
          
          # Build signed app bundle
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon
          
          # Verify bundle was created
          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "❌ App bundle not created"
            exit 1
          fi
          
          echo "✅ App bundle created successfully"
      
      - name: Generate bundle report
        run: |
          cd android
          BUNDLE_SIZE=$(du -h app/build/outputs/bundle/release/app-release.aab | cut -f1)
          echo "App Bundle Size: $BUNDLE_SIZE"
      
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  test-bundle:
    name: Test App Bundle
    runs-on: ubuntu-latest
    needs: build-bundle
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download bundle artifact
        uses: actions/download-artifact@v3
        with:
          name: app-bundle
          path: ./bundle
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: Validate bundle signature
        run: |
          jarsigner -verify -verbose -certs bundle/app-release.aab
          
          if [ $? -eq 0 ]; then
            echo "✅ Bundle signature is valid"
          else
            echo "❌ Bundle signature is invalid"
            exit 1
          fi
      
      - name: Check bundle structure
        run: |
          # List bundle contents
          unzip -l bundle/app-release.aab | head -20
          
          # Verify required files
          if unzip -l bundle/app-release.aab | grep -q "AndroidManifest.xml"; then
            echo "✅ AndroidManifest.xml found"
          else
            echo "❌ AndroidManifest.xml not found"
            exit 1
          fi
      
      - name: Generate bundle report
        run: |
          echo "## App Bundle Report" > bundle-report.md
          echo "" >> bundle-report.md
          echo "**Bundle Size**: $(du -h bundle/app-release.aab | cut -f1)" >> bundle-report.md
          echo "**Signature**: Valid" >> bundle-report.md
          echo "**Status**: Ready for Play Store" >> bundle-report.md
          
          cat bundle-report.md
      
      - name: Upload bundle report
        uses: actions/upload-artifact@v3
        with:
          name: bundle-report
          path: bundle-report.md

  deploy-playstore:
    name: Deploy to Google Play Store
    runs-on: ubuntu-latest
    needs: [build-bundle, test-bundle]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download bundle artifact
        uses: actions/download-artifact@v3
        with:
          name: app-bundle
          path: ./bundle
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: Decode Play Store credentials
        env:
          PLAYSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAYSTORE_SERVICE_ACCOUNT_JSON" > playstore-credentials.json
          
          # Verify credentials file
          if [ ! -f "playstore-credentials.json" ]; then
            echo "❌ Play Store credentials file not created"
            exit 1
          fi
          
          echo "✅ Play Store credentials loaded"
      
      - name: Determine release track
        id: release_track
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TRACK="${{ github.event.inputs.release_type }}"
          else
            # Default to internal testing for automatic deployments
            TRACK="internal"
          fi
          
          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "Release track: $TRACK"
      
      - name: Deploy to Play Store (Internal Testing)
        if: steps.release_track.outputs.track == 'internal'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAYSTORE_PACKAGE_NAME }}
          releaseFiles: 'bundle/app-release.aab'
          track: 'internal'
          status: 'draft'
          inAppUpdatePriority: 3
          whatsNewDirectory: 'whats-new'
          mappingFile: 'android/app/build/outputs/mapping/release/mapping.txt'
      
      - name: Deploy to Play Store (Alpha)
        if: steps.release_track.outputs.track == 'alpha'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAYSTORE_PACKAGE_NAME }}
          releaseFiles: 'bundle/app-release.aab'
          track: 'alpha'
          status: 'draft'
          inAppUpdatePriority: 2
          whatsNewDirectory: 'whats-new'
          mappingFile: 'android/app/build/outputs/mapping/release/mapping.txt'
      
      - name: Deploy to Play Store (Beta)
        if: steps.release_track.outputs.track == 'beta'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAYSTORE_PACKAGE_NAME }}
          releaseFiles: 'bundle/app-release.aab'
          track: 'beta'
          status: 'draft'
          inAppUpdatePriority: 1
          whatsNewDirectory: 'whats-new'
          mappingFile: 'android/app/build/outputs/mapping/release/mapping.txt'
      
      - name: Deploy to Play Store (Production)
        if: steps.release_track.outputs.track == 'production'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAYSTORE_PACKAGE_NAME }}
          releaseFiles: 'bundle/app-release.aab'
          track: 'production'
          status: 'completed'
          inAppUpdatePriority: 0
          whatsNewDirectory: 'whats-new'
          mappingFile: 'android/app/build/outputs/mapping/release/mapping.txt'
      
      - name: Deployment successful
        run: |
          echo "✅ App deployed to Play Store"
          echo "Track: ${{ steps.release_track.outputs.track }}"
          echo "Package: ${{ secrets.PLAYSTORE_PACKAGE_NAME }}"

  post-deploy:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: deploy-playstore
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deployment notification
        run: |
          echo "## 🚀 Play Store Deployment Report" > deployment-report.md
          echo "" >> deployment-report.md
          echo "**Status**: ${{ needs.deploy-playstore.result }}" >> deployment-report.md
          echo "**Track**: ${{ steps.release_track.outputs.track }}" >> deployment-report.md
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> deployment-report.md
          echo "**Commit**: ${{ github.sha }}" >> deployment-report.md
          echo "**Branch**: ${{ github.ref }}" >> deployment-report.md
          echo "" >> deployment-report.md
          echo "### Next Steps" >> deployment-report.md
          echo "1. Monitor app reviews on Play Store" >> deployment-report.md
          echo "2. Check crash reports in Firebase Crashlytics" >> deployment-report.md
          echo "3. Monitor user ratings and feedback" >> deployment-report.md
          echo "4. Prepare hotfix if needed" >> deployment-report.md
          
          cat deployment-report.md
      
      - name: Upload deployment report
        uses: actions/upload-artifact@v3
        with:
          name: deployment-report
          path: deployment-report.md
      
      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "NetTunnel Pro Play Store Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*: ${{ needs.deploy-playstore.result }}\n*Track*: ${{ steps.release_track.outputs.track }}\n*Package*: ${{ secrets.PLAYSTORE_PACKAGE_NAME }}\n*Time*: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
                  }
                }
              ]
            }
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
      
      - name: Create GitHub Issue for monitoring
        if: needs.deploy-playstore.result == 'success'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Monitor Play Store Deployment - v${{ github.run_number }}`,
              body: `
                ## Play Store Deployment Monitoring
                
                **Release**: v${{ github.run_number }}
                **Track**: ${{ steps.release_track.outputs.track }}
                **Deployed**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
                
                ### Monitoring Checklist
                - [ ] App appears in Play Store
                - [ ] No crash reports in Firebase
                - [ ] User ratings are positive
                - [ ] No security warnings
                - [ ] Performance metrics are normal
                
                ### Rollback Plan
                If issues are found:
                1. Immediately remove from Play Store
                2. Create hotfix PR
                3. Re-deploy with fix
              `,
              labels: ['deployment', 'playstore', 'monitoring']
            })
