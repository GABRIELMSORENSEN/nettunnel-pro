plugins { id 'com.android.application' }
android {
    namespace 'com.g4t0xx.nettunnel'
    compileSdk 36
    defaultConfig { testInstrumentationRunner 'com.g4t0xx.nettunnel.TunnelProbe'; applicationId 'com.nettunnel.pro'; minSdk 26; targetSdk 36; versionCode 20001; versionName '2.0.0-preview.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if(System.getenv('G4T0XX_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('G4T0XX_ANDROID_KEYSTORE'))
                storePassword System.getenv('G4T0XX_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('G4T0XX_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('G4T0XX_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if(System.getenv('G4T0XX_ANDROID_KEYSTORE')) signingConfig signingConfigs.release } }
}
dependencies { implementation 'com.wireguard.android:tunnel:1.0.20260102' }
